name: CI/CD

# Two halves in one run, so the release ships the DMG the build produced.
#
# CI ends in `Checks`, the one status a ruleset should require. `build`, the
# only macOS job, runs only when the change needs it (see `changes`); a skipped
# job passes `Checks`, a failed or cancelled one fails it.
#
# CD runs on main after `Checks`. A push that changes VERSION to a version not
# yet released publishes the GitHub release and updates the Homebrew tap. A
# manual run releases VERSION if it is not out yet, which is how a failed
# release is retried.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run, and so does a newer push
# to main that releases nothing. A push that changes VERSION may release, so it
# gets a group of its own and is never cancelled; nor is a manual run.
concurrency:
  group: "ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || contains(github.event.head_commit.modified, 'VERSION') && format('release-{0}', github.sha) || 'main' }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !contains(github.event.head_commit.modified, 'VERSION')) }}"

jobs:
  # ── CI ──────────────────────────────────────────────────────────────────

  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      release: ${{ steps.filter.outputs.release }}
      version: ${{ steps.filter.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        # `app` decides whether this run takes a macOS runner, from a pool
        # every macOS job on the account shares.
        #
        # A pull request takes one when it changes anything the app is built
        # from, compared with its base (the merge commit's first parent).
        # Allowlisted, so a new top-level directory of code needs adding here.
        # Markdown is documentation wherever it sits.
        #
        # A push to main takes one only to release, since its pull request
        # already tested the same tree. A manual run, or a diff that cannot be
        # worked out, takes one.
        #
        # Whether this run releases is the one answer the release job reads,
        # independent of the diff: a push that changes VERSION, or a manual run
        # on main, while VERSION has no GitHub release and is above the latest
        # one. A pull request that changes VERSION is a release PR and builds;
        # it publishes nothing.
        run: |
          app=true release=false
          version=$(tr -d '[:space:]' < VERSION)
          # A push compares with the commit before the whole push, which may be
          # several commits back.
          prior=HEAD^1
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null; then
            prior=$BEFORE
          fi
          bumped=false
          if [ "$(git show "$prior:VERSION" 2>/dev/null | tr -d '[:space:]')" != "$version" ]; then
            bumped=true
          fi
          # Releasable: no release for VERSION, and VERSION above the latest.
          # If GitHub cannot be asked, fail rather than guess either way.
          releasable() {
            local out latest
            if out=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
              return 1
            elif [ "$out" != "release not found" ]; then
              echo "::error::could not check for release v$version: $out"
              exit 1
            fi
            latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null | sed 's/^v//')
            [ "$(printf '%s\n%s\n' "${latest:-0.0.0}" "$version" | sort -V | tail -1)" = "$version" ]
          }
          case "$EVENT" in
            pull_request)
              release=$bumped
              if [ "$release" = false ] && files=$(git diff --name-only HEAD^1 HEAD); then
                printf 'changes since base:\n%s\n' "$files" | sed '2,$s/^/  /'
                printf '%s\n' "$files" \
                  | grep -E '^(Sources|Tests|Resources|Scripts)/|^Package\.(swift|resolved)$|^Taskfile\.yml$|^VERSION$|^\.github/' \
                  | grep -qvE '\.md$' || app=false
              fi
              ;;
            push)
              if [ "$bumped" = true ] && releasable; then release=true; fi
              app=$release
              ;;
            *)
              if [ "$GITHUB_REF" = refs/heads/main ] && releasable; then release=true; fi
              ;;
          esac
          {
            echo "app=$app"
            echo "release=$release"
            echo "version=$version"
          } | tee -a "$GITHUB_OUTPUT"

  # The only macOS job. It tests and builds the DMG, which a pull request
  # uploads unsigned. A release run instead signs and notarises it on the same
  # runner and uploads that for `release` to publish, so nothing is built
  # twice and the publish itself runs on Linux.
  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      SIGN: ${{ github.event_name != 'pull_request' && needs.changes.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Task and uv
        run: brew install go-task/tap/go-task uv

      - name: Run tests
        run: swift test

      # The Developer ID certificate goes into a keychain made for this job
      # alone, with a random password, and codesign may use its key without a
      # prompt. The identity name is read back from the certificate so it can
      # be renewed without editing the workflow.
      - name: Import Developer ID certificate
        if: env.SIGN == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # The existing search list, one keychain per word.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          test -n "$identity" || { echo "::error::no Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build DMG
        run: task build-dmg

      - name: Notarise
        if: env.SIGN == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY_PATH"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          task notarize

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BrowserSchedule.dmg
          path: .build/pkg/BrowserSchedule.dmg
          if-no-files-found: error

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, build]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')
          if [ -n "$bad" ]; then
            echo "::error::not passed: $bad"
            exit 1
          fi

  # ── CD ──────────────────────────────────────────────────────────────────
  #
  # `checks` runs whatever its needs did, so this states every result it
  # depends on rather than relying on the default.

  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, build, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.build.result == 'success' && needs.changes.outputs.release == 'true' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: BrowserSchedule.dmg
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.changes.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/BrowserSchedule.dmg
          body: |
            ## BrowserSchedule v${{ needs.changes.outputs.version }}

            Automatic browser switching based on time, day, and URL patterns.

            ### Install via Homebrew (Recommended)
            ```sh
            brew install --cask radiosilence/browser-schedule/browser-schedule
            ```

            ### Install Manually
            1. Download `BrowserSchedule.dmg` below
            2. Open the DMG and drag BrowserSchedule onto the Applications shortcut in its window
            3. **Double-click the app** to open settings and set as default browser

            ### Changes
            See commit history for detailed changes.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Update Homebrew Tap
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ needs.changes.outputs.version }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::notice::RELEASE_TOKEN is not set; skipping the Homebrew tap update"
            exit 0
          fi
          SHA256=$(sha256sum dist/BrowserSchedule.dmg | awk '{print $1}')

          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/radiosilence/homebrew-browser-schedule.git" "$RUNNER_TEMP/homebrew-tap"
          cd "$RUNNER_TEMP/homebrew-tap"
          mkdir -p Casks

          {
            printf 'cask "browser-schedule" do\n'
            printf '  version "%s"\n' "${RELEASE_VERSION}"
            printf '  sha256 "%s"\n' "${SHA256}"
            printf '\n'
            printf '  url "https://github.com/radiosilence/browser-schedule/releases/download/v#{version}/BrowserSchedule.dmg"\n'
            printf '  name "BrowserSchedule"\n'
            printf '  desc "Automatic browser switching based on time, day, and URL patterns"\n'
            printf '  homepage "https://github.com/radiosilence/browser-schedule"\n'
            printf '\n'
            printf '  depends_on arch: :arm64\n'
            printf '  depends_on macos: :sonoma\n'
            printf '\n'
            printf '  app "BrowserSchedule.app"\n'
            printf '\n'
            printf '  zap trash: "~/.config/browser-schedule"\n'
            printf 'end\n'
          } > Casks/browser-schedule.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update browser-schedule to v${RELEASE_VERSION}"
          git push
