name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  # Decides whether this run needs a macOS runner, a pool every macOS job on
  # the account shares. A pull request takes one only when it changes more
  # than documentation, and packages the DMG only when it changes VERSION. A
  # push to main takes one only to release, since the pull request already
  # ran the tests; a release is a push that raises VERSION above the latest
  # GitHub release.
  changes:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.decide.outputs.macos }}
      release: ${{ steps.decide.outputs.release }}
      package: ${{ steps.decide.outputs.package }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "pull_request" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
            printf 'Changed files:\n%s\n' "$changed"
            if printf '%s\n' "$changed" | grep -qvE '\.md$|^LICENSE$|^config\.template\.toml$|^\.gitignore$|^$'; then
              echo "macos=true" >> "$GITHUB_OUTPUT"
            else
              echo "macos=false" >> "$GITHUB_OUTPUT"
            fi
            if printf '%s\n' "$changed" | grep -qx 'VERSION'; then
              echo "package=true" >> "$GITHUB_OUTPUT"
            else
              echo "package=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q '.tagName' 2>/dev/null | sed 's/^v//')
          LATEST=${LATEST:-0.0.0}
          if [ "$VERSION" != "$LATEST" ] && printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1 | grep -qx "$VERSION"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi
          echo "package=false" >> "$GITHUB_OUTPUT"

  # The only macOS job. On a pull request it runs the tests, and a pull
  # request that bumps VERSION also builds an unsigned DMG so packaging
  # breaks before the version merges. On a release it tests, builds and signs
  # the DMG, notarises it, publishes the release and updates the Homebrew tap
  # on the same runner.
  build:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Task and uv
        run: brew install go-task/tap/go-task uv

      - name: Run tests
        run: swift test

      # Runs even when the tests fail, so one run reports both.
      - name: Build unsigned DMG
        id: dmg
        if: ${{ !cancelled() && needs.changes.outputs.package == 'true' }}
        run: task build-dmg

      - name: Upload DMG
        if: ${{ !cancelled() && steps.dmg.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BrowserSchedule.dmg
          path: .build/pkg/BrowserSchedule.dmg

      # The Developer ID certificate goes into a keychain made for this job
      # alone, with a random password, and codesign may use its key without a
      # prompt. The identity name is read back from the certificate so it can
      # be renewed without editing the workflow.
      - name: Import Developer ID certificate
        if: needs.changes.outputs.release == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          test -n "$identity" || { echo "::error::no Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build signed DMG
        if: needs.changes.outputs.release == 'true'
        run: task build-dmg

      - name: Notarise
        if: needs.changes.outputs.release == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY_PATH"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          task notarize

      - name: Create Release
        if: needs.changes.outputs.release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.changes.outputs.version }}
          files: ./.build/pkg/BrowserSchedule.dmg
          body: |
            ## BrowserSchedule v${{ needs.changes.outputs.version }}

            Automatic browser switching based on time, day, and URL patterns.

            ### Install via Homebrew (Recommended)
            ```sh
            brew install --cask radiosilence/browser-schedule/browser-schedule
            ```

            ### Install Manually
            1. Download `BrowserSchedule.dmg` below
            2. Open the DMG and drag BrowserSchedule onto the Applications shortcut in its window
            3. **Double-click the app** to open settings and set as default browser

            ### Changes
            See commit history for detailed changes.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Update Homebrew Tap
        if: needs.changes.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ needs.changes.outputs.version }}
        run: |
          SHA256=$(shasum -a 256 .build/pkg/BrowserSchedule.dmg | awk '{print $1}')

          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/radiosilence/homebrew-browser-schedule.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          mkdir -p Casks

          printf 'cask "browser-schedule" do\n' > Casks/browser-schedule.rb
          printf '  version "%s"\n' "${RELEASE_VERSION}" >> Casks/browser-schedule.rb
          printf '  sha256 "%s"\n' "${SHA256}" >> Casks/browser-schedule.rb
          printf '\n' >> Casks/browser-schedule.rb
          printf '  url "https://github.com/radiosilence/browser-schedule/releases/download/v#{version}/BrowserSchedule.dmg"\n' >> Casks/browser-schedule.rb
          printf '  name "BrowserSchedule"\n' >> Casks/browser-schedule.rb
          printf '  desc "Automatic browser switching based on time, day, and URL patterns"\n' >> Casks/browser-schedule.rb
          printf '  homepage "https://github.com/radiosilence/browser-schedule"\n' >> Casks/browser-schedule.rb
          printf '\n' >> Casks/browser-schedule.rb
          printf '  depends_on arch: :arm64\n' >> Casks/browser-schedule.rb
          printf '  depends_on macos: :sonoma\n' >> Casks/browser-schedule.rb
          printf '\n' >> Casks/browser-schedule.rb
          printf '  app "BrowserSchedule.app"\n' >> Casks/browser-schedule.rb
          printf '\n' >> Casks/browser-schedule.rb
          printf '  zap trash: "~/.config/browser-schedule"\n' >> Casks/browser-schedule.rb
          printf 'end\n' >> Casks/browser-schedule.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update browser-schedule to v${RELEASE_VERSION}"
          git push
