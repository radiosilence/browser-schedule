name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.1"

      - name: Install Task
        run: brew install go-task/tap/go-task

      - name: Run tests
        run: swift test

      - name: Build DMG
        run: task build-dmg

      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BrowserSchedule.dmg
          path: .build/pkg/BrowserSchedule.dmg

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Read Version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Get Latest Release
        id: latest
        run: |
          LATEST=$(gh release view --json tagName -q '.tagName' 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Check Version Bump
        id: check
        run: |
          CURRENT="${{ steps.version.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"
          if printf '%s\n%s' "$LATEST" "$CURRENT" | sort -V | tail -1 | grep -qx "$CURRENT" && [ "$CURRENT" != "$LATEST" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Swift
        if: steps.check.outputs.should_release == 'true'
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.1"

      - name: Install Task
        if: steps.check.outputs.should_release == 'true'
        run: brew install go-task/tap/go-task

      # The Developer ID certificate goes into a keychain made for this job
      # alone, with a random password, and codesign may use its key without a
      # prompt. The identity name is read back from the certificate so it can
      # be renewed without editing the workflow.
      - name: Import Developer ID certificate
        if: steps.check.outputs.should_release == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          test -n "$identity" || { echo "::error::no Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build signed DMG
        if: steps.check.outputs.should_release == 'true'
        run: task build-dmg

      - name: Notarise
        if: steps.check.outputs.should_release == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY_PATH"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          task notarize

      - name: Create Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: ./.build/pkg/BrowserSchedule.dmg
          body: |
            ## BrowserSchedule v${{ steps.version.outputs.version }}

            Automatic browser switching based on time, day, and URL patterns.

            ### Install via Homebrew (Recommended)
            ```sh
            brew install --cask radiosilence/browser-schedule/browser-schedule
            ```

            ### Install Manually
            1. Download `BrowserSchedule.dmg` below
            2. Mount the DMG and drag BrowserSchedule.app to Applications
            3. **Double-click the app** to open settings and set as default browser

            ### Changes
            See commit history for detailed changes.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Update Homebrew Tap
        if: steps.check.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA256=$(shasum -a 256 .build/pkg/BrowserSchedule.dmg | awk '{print $1}')

          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/radiosilence/homebrew-browser-schedule.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          mkdir -p Casks

          printf 'cask "browser-schedule" do\n' > Casks/browser-schedule.rb
          printf '  version "%s"\n' "${RELEASE_VERSION}" >> Casks/browser-schedule.rb
          printf '  sha256 "%s"\n' "${SHA256}" >> Casks/browser-schedule.rb
          printf '\n' >> Casks/browser-schedule.rb
          printf '  url "https://github.com/radiosilence/browser-schedule/releases/download/v#{version}/BrowserSchedule.dmg"\n' >> Casks/browser-schedule.rb
          printf '  name "BrowserSchedule"\n' >> Casks/browser-schedule.rb
          printf '  desc "Automatic browser switching based on time, day, and URL patterns"\n' >> Casks/browser-schedule.rb
          printf '  homepage "https://github.com/radiosilence/browser-schedule"\n' >> Casks/browser-schedule.rb
          printf '\n' >> Casks/browser-schedule.rb
          printf '  depends_on macos: :sonoma\n' >> Casks/browser-schedule.rb
          printf '\n' >> Casks/browser-schedule.rb
          printf '  app "BrowserSchedule.app"\n' >> Casks/browser-schedule.rb
          printf '\n' >> Casks/browser-schedule.rb
          printf '  zap trash: "~/.config/browser-schedule"\n' >> Casks/browser-schedule.rb
          printf 'end\n' >> Casks/browser-schedule.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update browser-schedule to v${RELEASE_VERSION}"
          git push
